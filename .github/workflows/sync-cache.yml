name: Repository cache maintenance

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-cache-maintenance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh cache marker
        shell: python
        run: |
          import datetime
          import json
          from pathlib import Path

          path = Path(".github/sync-cache.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          payload = {
              "version": 1,
              "synced_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          path.write_text(json.dumps(payload) + "\n")

      - name: Record the maintenance update
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "maintenance: refresh repository cache [skip ci]"
          file_pattern: .github/sync-cache.json
          branch: main
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
