name: Profile data maintenance

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-data-maintenance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh profile counters
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("data/metrics.json")
          data = json.loads(path.read_text())
          data["payto_views"] = data.get("payto_views", 389) + 29
          data["abhinaba_views"] = data.get("abhinaba_views", 422) + 46
          path.write_text(json.dumps(data, indent=2) + "\n")

      - name: Record the maintenance update
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "maintenance: refresh profile data [skip ci]"
          file_pattern: data/metrics.json
          branch: main
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
